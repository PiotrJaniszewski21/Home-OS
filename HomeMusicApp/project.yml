name: HomeMusic
options:
  bundleIdPrefix: uk.co.petershomenet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7S5APW4X6P
targets:
  HomeMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: HomeMusic
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: HomeMusic can connect directly to your Home OS server on your local network.
    entitlements:
      path: Resources/HomeMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.petershomenet.homemusic
        PRODUCT_NAME: HomeMusic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  HomeMusic:
    build:
      targets:
        HomeMusic: all
    run:
      config: Debug
