name: HomeMusic
options:
  bundleIdPrefix: uk.co.petershomenet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7S5APW4X6P
targets:
  HomeMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: HomeMusic
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - uk.co.petershomenet.homemusic.cache-refresh
        NSLocalNetworkUsageDescription: HomeMusic can connect directly to your Home OS server on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
    entitlements:
      path: Resources/HomeMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.petershomenet.homemusic
        PRODUCT_NAME: HomeMusic
        TARGETED_DEVICE_FAMILY: "1"
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "2,6"
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  HomeMusic:
    build:
      targets:
        HomeMusic: all
    run:
      config: Debug
